name: Arduino Compile Check (AI Auto-Fix Robust)

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  attestations: write
  id-token: write
  models: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install core + libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib update-index
          arduino-cli lib install Servo

      - name: Compile sketch
        id: compile
        run: |
          set +e
          arduino-cli compile \
            --fqbn arduino:avr:mega \
            --output-dir build \
            ./servosensorled > build.log 2>&1
          echo "exit_code=$?" >> $GITHUB_OUTPUT

      - name: Show build log (debug)
        if: steps.compile.outputs.exit_code != '0'
        run: |
          echo "==== BUILD LOG ===="
          cat build.log || true

      - name: Build AI payload
        if: steps.compile.outputs.exit_code != '0'
        run: |
          python3 -c "
          import json
          log = open('build.log').read()[-5000:]
          payload = {
            'model': 'openai/gpt-4o',
            'messages': [
              {
                'role': 'system',
                'content': 'You are an expert Arduino C++ engineer. Return ONLY valid JSON: {\"file\":\"path\",\"patch\":\"full corrected file\"}. No markdown. No explanation.'
              },
              {
                'role': 'user',
                'content': 'Fix this Arduino build error:\n\n' + log
              }
            ]
          }
          json.dump(payload, open('payload.json', 'w'))
          "

      - name: Call GitHub Models
        if: steps.compile.outputs.exit_code != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d @payload.json \
            https://models.github.ai/inference/chat/completions \
            -o ai_response.json || echo '{}' > ai_response.json

      - name: Validate AI response
        if: steps.compile.outputs.exit_code != '0'
        run: |
          python3 -m json.tool ai_response.json > /dev/null || {
            echo "Invalid AI JSON response"
            cat ai_response.json
            exit 1
          }

      - name: Extract AI fix
        if: steps.compile.outputs.exit_code != '0'
        run: |
          python3 -c "
          import json
          data = json.load(open('ai_response.json'))
          print(data['choices'][0]['message']['content'])
          " > fix.txt

      - name: Apply fix and create branch
        if: steps.compile.outputs.exit_code != '0'
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@users.noreply.github.com"

          BRANCH="ai-fix-${GITHUB_RUN_ID}"
          git checkout -b $BRANCH

          FILE=$(python3 -c "
          import json
          data = json.loads(open('fix.txt').read())
          print(data['file'])
          ")

          python3 -c "
          import json
          data = json.loads(open('fix.txt').read())
          open('fixed.cpp', 'w').write(data['patch'])
          "

          if [ -f "$FILE" ]; then
            cp fixed.cpp "$FILE"
          else
            echo "AI did not return valid file path"
            exit 1
          fi

          git add .
          git commit -m "AI auto-fix for Arduino build failure"
          git push origin $BRANCH

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      - name: Create PR
        if: steps.compile.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.BRANCH;
            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: "main",
              title: "AI Auto-Fix Arduino Build",
              body: "Automated fix generated by GitHub Models after build failure."
            });

      - name: Upload build artifact
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: arduino-build
          path: build/

      - name: Generate artifact attestation
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/**