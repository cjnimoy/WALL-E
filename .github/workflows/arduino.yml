name: Arduino Compile Check (AI Auto-Fix Robust)

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  attestations: write
  id-token: write
  models: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install core + libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib update-index
          arduino-cli lib install Servo

      # -------------------------
      # COMPILE STEP
      # -------------------------
      - name: Compile sketch
        id: compile
        run: |
          set +e

          arduino-cli compile \
            --fqbn arduino:avr:mega \
            --output-dir build \
            ./servosensorled > build.log 2>&1

          echo "exit_code=$?" >> $GITHUB_OUTPUT

      # -------------------------
      # DEBUG (optional but useful)
      # -------------------------
      - name: Show build log (debug)
        if: steps.compile.outputs.exit_code != '0'
        run: |
          echo "==== BUILD LOG ===="
          cat build.log || true

      # -------------------------
      # BUILD AI REQUEST PAYLOAD
      # -------------------------
      - name: Build AI payload
        if: steps.compile.outputs.exit_code != '0'
        run: |
          LOG=$(tail -200 build.log | sed 's/"/\\"/g')

          cat <<EOF > payload.json
{
  "model": "openai/gpt-4o",
  "messages": [
    {
      "role": "system",
      "content": "You are an expert Arduino C++ engineer. Return ONLY valid JSON: {\"file\":\"path\",\"patch\":\"full corrected file\"}. No markdown. No explanation."
    },
    {
      "role": "user",
      "content": "Fix this Arduino build error:\n\n$LOG"
    }
  ]
}
EOF

      # -------------------------
      # CALL GITHUB MODELS (TRY 1)
      # -------------------------
      - name: Call GitHub Models
        if: steps.compile.outputs.exit_code != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d @payload.json \
            https://models.github.ai/inference/chat/completions \
            -o ai_response.json || echo '{}' > ai_response.json

      # -------------------------
      # VALIDATE JSON SAFELY
      # -------------------------
      - name: Validate AI response
        if: steps.compile.outputs.exit_code != '0'
        run: |
          python3 -m json.tool ai_response.json > /dev/null || {
            echo " Invalid AI JSON response"
            cat ai_response.json
            exit 1
          }

      # -------------------------
      # EXTRACT AI FIX (SAFE)
      # -------------------------
      - name: Extract AI fix
        if: steps.compile.outputs.exit_code != '0'
        run: |
          python3 << 'EOF' > fix.txt
          
import json

with open("ai_response.json") as f:
    data = json.load(f)

content = data["choices"][0]["message"]["content"]
print(content)
EOF

      # -------------------------
      # CREATE FIX BRANCH
      # -------------------------
      - name: Apply fix and create branch
        if: steps.compile.outputs.exit_code != '0'
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@users.noreply.github.com"

          BRANCH="ai-fix-${GITHUB_RUN_ID}"
          git checkout -b $BRANCH

          FILE=$(grep "file" fix.txt | sed 's/.*"file"[ ]*:[ ]*"//; s/".*//')

          awk '/PATCH:/ {flag=1; next} flag' fix.txt > fixed.cpp

          if [ -f "$FILE" ]; then
            cp fixed.cpp "$FILE"
          else
            echo "AI did not return valid file path"
            exit 1
          fi

          git add .
          git commit -m " AI auto-fix for Arduino build failure"
          git push origin $BRANCH

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      # -------------------------
      # CREATE PULL REQUEST
      # -------------------------
      - name: Create PR
        if: steps.compile.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.BRANCH;

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: branch,
              base: "main",
              title: " AI Auto-Fix Arduino Build",
              body: "Automated fix generated by GitHub Models after build failure."
            });

      # -------------------------
      # SUCCESS PATH
      # -------------------------
      - name: Upload build artifact
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: arduino-build
          path: build/

      - name: Generate artifact attestation
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/**