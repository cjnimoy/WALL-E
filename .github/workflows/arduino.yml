name: Arduino Compile Check (AI Auto-Fix)

on:
  push:
  pull_request:

permissions:
  contents: write
  pull-requests: write
  attestations: write
  id-token: write
  models: read

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install core + libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib update-index
          arduino-cli lib install Servo

      # -------------------------
      # COMPILE STEP
      # -------------------------
      - name: Compile sketch
        id: compile
        run: |
          set +e

          arduino-cli compile \
            --fqbn arduino:avr:mega \
            --output-dir build \
            ./servosensorled > build.log 2>&1

          echo "exit_code=$?" >> $GITHUB_OUTPUT

      # -------------------------
      # AI ANALYSIS STEP
      # -------------------------
      - name: Ask AI for fix
        if: steps.compile.outputs.exit_code != '0'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOG=$(tail -200 build.log | sed 's/"/\\"/g')

          curl "https://models.github.ai/inference/chat/completions" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -d "{
              \"model\": \"openai/gpt-4o\",
              \"messages\": [
                {
                  \"role\": \"system\",
                  \"content\": \"You are an expert Arduino C++ engineer. You must return ONLY a code fix in this format:\\n\\nFILE: <file_path>\\nPATCH:\\n<full corrected file or unified diff>\\nNo explanations.\"
                },
                {
                  \"role\": \"user\",
                  \"content\": \"Fix this Arduino build error:\\n\\n$LOG\"
                }
              ]
            }" > ai_response.json

      # -------------------------
      # EXTRACT FIX
      # -------------------------
      - name: Parse AI response
        if: steps.compile.outputs.exit_code != '0'
        run: |
          sudo apt-get update && sudo apt-get install -y jq

          jq -r '.choices[0].message.content' ai_response.json > fix.txt

      # -------------------------
      # CREATE FIX BRANCH
      # -------------------------
      - name: Apply AI fix and create branch
        if: steps.compile.outputs.exit_code != '0'
        run: |
          git config user.name "ai-bot"
          git config user.email "ai-bot@users.noreply.github.com"

          BRANCH="ai-fix-${GITHUB_RUN_ID}"

          git checkout -b $BRANCH

          # naive overwrite approach (simple + reliable)
          # expects full file content in FIX step
          FILE=$(grep "FILE:" fix.txt | sed 's/FILE: //')

          # everything after PATCH:
          awk '/PATCH:/ {flag=1; next} flag' fix.txt > fixed_code.cpp

          # overwrite file if provided
          if [ -f "$FILE" ]; then
            cp fixed_code.cpp "$FILE"
          else
            echo "No valid file path returned by AI"
            exit 1
          fi

          git add .
          git commit -m "AI auto-fix for Arduino build failure"
          git push origin $BRANCH

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      # -------------------------
      # CREATE PULL REQUEST
      # -------------------------
      - name: Open PR with fix
        if: steps.compile.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.BRANCH;

            await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "AI Auto-Fix for Arduino Build Failure",
              head: branch,
              base: "main",
              body: "This PR was automatically generated by GitHub Models after detecting a build failure."
            });

      # -------------------------
      # SUCCESS PATH (NORMAL BUILD)
      # -------------------------
      - name: Upload build artifact
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: arduino-build
          path: build/

      - name: Generate artifact attestation
        if: steps.compile.outputs.exit_code == '0'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: build/**